name: Create signing key (run ONCE)

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXISTING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$EXISTING_KEY" ]; then
            echo "::error::Secret KEYSTORE_BASE64 already exists. A new key would break updates, so nothing was created."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ "${#KEYSTORE_PASSWORD}" -lt 8 ]; then
            echo "::error::First create the secret KEYSTORE_PASSWORD (at least 8 letters/digits)."
            exit 1
          fi

          keytool -genkeypair -keystore v2plas.jks -storetype PKCS12 \
            -alias v2plas -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=V2 Plas, O=V2 Plas, C=IR"

          echo "== Key fingerprint (safe to note down) =="
          keytool -list -keystore v2plas.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "fingerprint\|Certificate"

          base64 -w 0 v2plas.jks > keystore_base64.txt
          echo
          echo "========== COPY EVERYTHING BETWEEN THE MARKERS =========="
          echo "BEGIN_KEY"
          cat keystore_base64.txt
          echo
          echo "END_KEY"

      - name: Save the key text as a one-day artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_base64.txt
          retention-days: 1
