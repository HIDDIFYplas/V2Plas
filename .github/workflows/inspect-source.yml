name: Export complete v2rayNG source (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact v2rayNG commit with submodules
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: aa4b05503a504a3f2e43818e6ee8ebf1caaa3df0
          path: V2rayNG
          submodules: recursive
          fetch-depth: 1

      - name: Locate and verify Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo "Checkout contents:"
          ls -la V2rayNG | head -60

          SETTINGS_FILE="$(find V2rayNG -maxdepth 5 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "Could not locate settings.gradle(.kts) in checkout."
            find V2rayNG -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          if [[ ! -d "$PROJECT_ROOT/app/src/main" ]]; then
            echo "Gradle settings found at: $SETTINGS_FILE"
            echo "But expected app/src/main was not found under: $PROJECT_ROOT"
            find "$PROJECT_ROOT" -maxdepth 4 -type d | head -200
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Verified project root: $PROJECT_ROOT"
          echo "Project size:"
          du -sh V2rayNG
          echo "Submodule status:"
          git -C V2rayNG submodule status || true

      - name: Create complete source archive
        shell: bash
        run: |
          set -euo pipefail
          zip -qr v2rayng-full-source.zip V2rayNG \
            -x 'V2rayNG/.git/*' \
               'V2rayNG/**/.git/*' \
               'V2rayNG/**/build/*' \
               'V2rayNG/.gradle/*' \
               'V2rayNG/**/.gradle/*'
          test -s v2rayng-full-source.zip
          ls -lh v2rayng-full-source.zip

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-full-source
          path: v2rayng-full-source.zip
          if-no-files-found: error
          retention-days: 3
