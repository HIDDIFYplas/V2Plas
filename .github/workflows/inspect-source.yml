name: Inspect v2rayNG source (quick, no build)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2rayNG (same pinned commit as the build)
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: aa4b05503a504a3f2e43818e6ee8ebf1caaa3df0
          fetch-depth: 1

      - name: Collect UI source files
        run: |
          set -e
          SNAP="$GITHUB_WORKSPACE/snap"
          mkdir -p "$SNAP"

          cd V2rayNG
          for f in build.gradle.kts settings.gradle.kts gradle/libs.versions.toml; do
            [ -f "$f" ] && cp --parents "$f" "$SNAP" || true
          done

          cd app
          [ -f build.gradle.kts ] && cp build.gradle.kts "$SNAP/app-build.gradle.kts" || true
          cp --parents src/main/AndroidManifest.xml "$SNAP"
          find src/main -name "*.kt" -exec cp --parents {} "$SNAP" \;
          find src/main/res -name "*.xml" ! -path "*/values-*" -exec cp --parents {} "$SNAP" \;

          echo "== Files collected =="
          cd "$SNAP"
          find . -type f | sort
          echo
          du -sh "$SNAP"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-source
          path: snap
          retention-days: 3
