name: Export complete v2rayNG source (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact v2rayNG commit with submodules
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: aa4b05503a504a3f2e43818e6ee8ebf1caaa3df0
          path: V2rayNG
          submodules: recursive
          fetch-depth: 1

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f V2rayNG/settings.gradle.kts
          test -f V2rayNG/gradlew
          test -d V2rayNG/app/src/main
          echo "Source tree verified"
          echo "Tracked source size:"
          du -sh V2rayNG
          echo "Submodules:"
          git -C V2rayNG submodule status || true

      - name: Create complete source archive
        shell: bash
        run: |
          set -euo pipefail
          zip -qr v2rayng-full-source.zip V2rayNG \
            -x 'V2rayNG/.git/*' \
               'V2rayNG/**/.git/*' \
               'V2rayNG/**/build/*' \
               'V2rayNG/.gradle/*'
          test -s v2rayng-full-source.zip
          ls -lh v2rayng-full-source.zip

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-full-source
          path: v2rayng-full-source.zip
          if-no-files-found: error
          retention-days: 3
